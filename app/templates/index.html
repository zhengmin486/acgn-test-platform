{% extends "base.html" %}
{% block title %}内容列表 - ACGN 测试平台{% endblock %}
{% block content %}
<h1 class="h3 mb-3">内容列表</h1>
<p class="text-muted small">以下为开发/测试用内存假数据，共 {{ contents|length }} 条。</p>
<table class="table table-hover align-middle bg-white">
    <thead>
    <tr>
        <th>ID</th>
        <th>标题</th>
        <th>类型</th>
        <th>评分</th>
    </tr>
    </thead>
    <tbody>
    {% for item in contents %}
    <tr>
        <td>{{ item.id }}</td>
        <td><a href="/contents/{{ item.id }}">{{ item.title }}</a></td>
        <td><span class="badge bg-secondary">{{ item.type }}</span></td>
        <td>{{ item.rating }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
