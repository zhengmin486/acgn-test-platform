<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ACGN 内容平台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
{# 公共骨架：仅提供站点结构（head / 导航槽 / 主体 / 页脚槽）。
   页面区域身份由子布局决定：
   - base_content.html → ACGN 内容平台布局（内容导航 + 测试管理入口）
   - base_admin.html   → 测试管理平台布局（管理导航 + 返回内容平台入口） #}
<body class="{% block body_class %}{% endblock %}">
{% block navbar %}{% endblock %}
<main class="container py-4">
    {% block content %}{% endblock %}
</main>
{% block footer %}
<footer class="site-footer">
    <div class="container py-4">
        <span class="small text-muted">ACGN 内容平台 · 内容浏览与接口测试 · 数据已接入本地 SQLite</span>
    </div>
</footer>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
